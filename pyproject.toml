[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinytms"
version = "0.1.0"
description = "Verifiable freight check-in: three model witnesses, a deterministic fail-closed judge, Ed25519 receipts."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pynacl>=1.5"]

[project.optional-dependencies]
local = ["mlx-vlm", "mlx-lm"]
dev = ["pytest>=8"]

[project.scripts]
tinytms = "tinytms.cli:main"

[tool.setuptools]
packages = ["tinytms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
