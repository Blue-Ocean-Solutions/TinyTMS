name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests (no network, no model key)
        env:
          MODEL_API_KEY: ""
        run: pytest -q
      - name: Numbers guard (README must cite receipts/ for ms/FPS/%/tok/s)
        run: pytest -q tests/test_readme_numbers.py
      - name: Docs numbers guard (README.md and docs/*.md must cite an existing receipts/ file)
        run: python scripts/check_docs_numbers.py
